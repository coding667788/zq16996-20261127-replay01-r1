[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofinterlock"
version = "1.0.0"
description = "Deterministic proof interlocking and safe policy-shard migration planning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "proofinterlock" }]
dependencies = []

[project.scripts]
proofinterlock = "proofinterlock.cli:main"

[tool.setuptools.packages.find]
include = ["proofinterlock*"]
